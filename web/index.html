<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart Glove — Camera Sign to Speech</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">

  <!-- MediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #090d16;
      --surface: rgba(18, 24, 38, 0.80);
      --surface-solid: #0f1623;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.2);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    /* ─── Full viewport lock — no scroll ever ─── */
    html {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ─── Floating pill header ─── */
    header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px 0 14px;
      height: 48px;
      margin: 8px 10px 0;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 999px;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.active {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ─── Icon button ─── */
    .icon-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s;
      flex-shrink: 0;
    }
    .icon-btn:hover, .icon-btn.active {
      background: rgba(255, 255, 255, 0.10);
      color: var(--text);
      border-color: var(--border-focus);
    }
    .icon-btn svg {
      width: 16px; height: 16px;
      fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ─── Camera area — fills remaining space ─── */
    .camera-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 6px 10px 6px;
    }

    .camera-card {
      flex: 1;
      position: relative;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    video { display: none; }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    canvas.mirrored { transform: scaleX(-1); }

    /* ─── Top-left transparent sensor overlay ─── */
    .sensor-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(9, 13, 22, 0.52);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 11px;
      padding: 8px 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 136px;
      z-index: 10;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .sensor-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .sensor-overlay-label {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1px;
    }
    .sensor-row-mini {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .finger-lbl {
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 500;
      width: 36px;
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.09);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      border-radius: 999px;
      transition: width 0.07s ease;
    }
    .finger-pct {
      color: var(--text-dim);
      font-size: 0.63rem;
      width: 23px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ─── Top-center detection pill ─── */
    .hud-pill {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(9, 13, 22, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      white-space: nowrap;
    }
    .hud-gesture {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text-muted);
    }
    .hud-gesture.detected { color: #34d399; }

    .timer-track {
      width: 44px;
      height: 3px;
      background: rgba(255,255,255,0.09);
      border-radius: 999px;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.05s linear;
    }

    /* ─── Bottom floating bar ─── */
    .bottom-hud {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 10;
    }

    .sentence-display {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      min-height: 24px;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }
    .sentence-placeholder {
      color: var(--text-dim);
      font-size: 0.88rem;
      font-weight: 400;
    }

    .bottom-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover {
      background: rgba(255,255,255,0.10);
      border-color: var(--border-focus);
    }
    .btn-accent {
      background: var(--accent);
      color: #022c22;
      border-color: transparent;
      font-weight: 700;
    }
    .btn-accent:hover { background: #34d399; }
    .btn-ghost { margin-left: auto; }
    .btn svg {
      width: 13px; height: 13px;
      fill: none; stroke: currentColor;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ─── Side Drawers ─── */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(3px);
      z-index: 90;
      display: none;
    }
    .backdrop.active { display: block; }

    .drawer {
      position: fixed;
      top: 0;
      right: -360px;
      width: 320px;
      max-width: 90vw;
      height: 100%;
      background: var(--surface-solid);
      border-left: 1px solid var(--border);
      box-shadow: -15px 0 35px rgba(0,0,0,0.5);
      z-index: 100;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: right 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }
    .drawer.open { right: 0; }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .drawer-title { font-size: 0.9rem; font-weight: 700; }

    /* Gesture list */
    .mini-item {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.8rem;
      margin-bottom: 5px;
      transition: all 0.15s;
    }
    .mini-item.active {
      background: rgba(16,185,129,0.1);
      border-color: rgba(16,185,129,0.4);
      color: #34d399;
      font-weight: 700;
    }
    .mini-item-desc {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ─── Drawings modal ─── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: none;
      overflow-y: auto;
      padding: 20px;
    }
    .modal-backdrop.active { display: block; }
    .modal-box {
      max-width: 820px;
      margin: 24px auto;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-title { font-weight: 700; font-size: 0.95rem; }
    .modal-box img {
      width: 100%;
      border-radius: 9px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
      display: block;
    }

    /* ─── Phone-specific tweaks ─── */
    @media (max-width: 480px) {
      header { margin: 6px 8px 0; height: 44px; }
      .camera-wrap { padding: 5px 8px 5px; }
      .sensor-overlay { top: 10px; left: 10px; width: 112px; padding: 7px 9px; }
      .finger-lbl { width: 30px; font-size: 0.63rem; }
      .bottom-hud { bottom: 8px; left: 8px; right: 8px; padding: 8px 10px; gap: 6px; }
      .sentence-display { font-size: 0.92rem; }
      .btn { font-size: 0.74rem; padding: 5px 10px; }
    }

    @media (max-width: 360px) {
      .sensor-overlay { width: 100px; }
      .btn { padding: 5px 8px; gap: 4px; }
    }
  </style>
</head>
<body>

  <!-- ═══ Floating Header ═══ -->
  <header>
    <div class="brand">
      <span class="status-dot" id="statusDot"></span>
      <span>Smart Glove</span>
    </div>
    <div class="header-actions">
      <!-- Camera On/Off -->
      <button class="icon-btn active" id="cameraBtn" onclick="toggleCamera()" title="Toggle Camera">
        <svg viewBox="0 0 24 24" id="cameraIcon"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>

      <!-- Flip Camera -->
      <button class="icon-btn" id="flipBtn" onclick="flipCamera()" title="Flip Camera">
        <svg viewBox="0 0 24 24"><path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 1.954.702 3.744 1.874 5.126L4 17h6v-6l-2.025 2.025C7.14 11.96 6.5 10.602 6.5 9c0-3.038 2.462-5.5 5.5-5.5s5.5 2.462 5.5 5.5h2.5zM4 14c0 4.418 3.582 8 8 8s8-3.582 8-8c0-1.954-.702-3.744-1.874-5.126L20 7h-6v6l2.025-2.025C16.86 12.04 17.5 13.398 17.5 15c0 3.038-2.462 5.5-5.5 5.5s-5.5-2.462-5.5-5.5H4z"/></svg>
      </button>
      <!-- Voice Toggle -->
      <button class="icon-btn active" id="voiceBtn" onclick="toggleAutoSpeak()" title="Auto Voice">
        <svg viewBox="0 0 24 24" id="voiceIcon"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>
      <!-- Sensors Toggle -->
      <button class="icon-btn active" id="sensorsBtn" onclick="toggleSensors()" title="Flex Sensors">
        <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      </button>
      <!-- Gesture Guide -->
      <button class="icon-btn" onclick="toggleDrawer('guide')" title="Gesture Guide">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </button>
    </div>
  </header>

  <!-- ═══ Camera Area ═══ -->
  <div class="camera-wrap">
    <div class="camera-card">
      <video id="webcam" playsinline webkit-playsinline></video>
      <canvas id="output_canvas" class="mirrored"></canvas>

      <!-- Top-left: Virtual Flex Sensors overlay -->
      <div class="sensor-overlay" id="sensorOverlay">
        <div class="sensor-overlay-label">Flex Sensors</div>
        <div class="sensor-row-mini">
          <span class="finger-lbl">Thumb</span>
          <div class="bar-track"><div class="bar-fill" id="ov_bar_0"></div></div>
          <span class="finger-pct" id="ov_val_0">0%</span>
        </div>
        <div class="sensor-row-mini">
          <span class="finger-lbl">Index</span>
          <div class="bar-track"><div class="bar-fill" id="ov_bar_1"></div></div>
          <span class="finger-pct" id="ov_val_1">0%</span>
        </div>
        <div class="sensor-row-mini">
          <span class="finger-lbl">Middle</span>
          <div class="bar-track"><div class="bar-fill" id="ov_bar_2"></div></div>
          <span class="finger-pct" id="ov_val_2">0%</span>
        </div>
        <div class="sensor-row-mini">
          <span class="finger-lbl">Ring</span>
          <div class="bar-track"><div class="bar-fill" id="ov_bar_3"></div></div>
          <span class="finger-pct" id="ov_val_3">0%</span>
        </div>
        <div class="sensor-row-mini">
          <span class="finger-lbl">Pinky</span>
          <div class="bar-track"><div class="bar-fill" id="ov_bar_4"></div></div>
          <span class="finger-pct" id="ov_val_4">0%</span>
        </div>
      </div>

      <!-- Top-center: Detection pill -->
      <div class="hud-pill">
        <span class="hud-gesture" id="hudGesture">Ready</span>
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      </div>

      <!-- Bottom: Sentence + controls -->
      <div class="bottom-hud">
        <div class="sentence-display" id="sentenceDisplay">
          <span class="sentence-placeholder">Hold gesture steady for 0.8s…</span>
        </div>
        <div class="bottom-actions">
          <button class="btn btn-accent" onclick="speakCurrentSentence()">
            <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            Speak
          </button>
          <button class="btn" onclick="undoLastWord()">
            <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
            Undo
          </button>
          <button class="btn btn-ghost" onclick="clearSentence()">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Clear
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Drawer Backdrop ═══ -->
  <div class="backdrop" id="backdrop" onclick="closeAllDrawers()"></div>

  <!-- ═══ Guide Drawer ═══ -->
  <div class="drawer" id="guideDrawer">
    <div class="drawer-header">
      <div class="drawer-title">Gesture Reference</div>
      <button class="icon-btn" onclick="closeAllDrawers()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <button class="btn" style="width:100%;justify-content:center;" onclick="openDrawingsModal()">
      🖼️ View Hand Drawing Sketches
    </button>
    <div id="gestureListContainer" style="flex:1;overflow-y:auto;"></div>
  </div>

  <!-- ═══ Drawings Modal ═══ -->
  <div class="modal-backdrop" id="drawingsModal" onclick="closeDrawingsModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title">Hand Sign Drawing Manual</span>
        <button class="icon-btn" onclick="closeDrawingsModal()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

  <script>
    /* ── Gesture definitions ── */
    const GESTURES = {
      "HELLO":      { spoken: "Hello",       ext: [1,1,1,1,1], pose: "Open palm — all 5 fingers extended" },
      "THANK YOU":  { spoken: "Thank you",   ext: [0,1,1,1,1], pose: "4 fingers flat, thumb tucked" },
      "YES":        { spoken: "Yes",         ext: [0,0,0,0,0], pose: "Closed fist" },
      "NO":         { spoken: "No",          ext: [1,1,1,0,0], pose: "Thumb + Index + Middle out" },
      "GOOD":       { spoken: "Good",        ext: [1,0,0,0,0], pose: "Thumbs up" },
      "YOU":        { spoken: "You",         ext: [0,1,0,0,0], pose: "Index finger pointing up" },
      "PEACE":      { spoken: "Peace",       ext: [0,1,1,0,0], pose: "V sign (Index + Middle)" },
      "WATER":      { spoken: "Water",       ext: [0,1,1,1,0], pose: "W sign (Index + Middle + Ring)" },
      "CALL ME":    { spoken: "Call me",     ext: [1,0,0,0,1], pose: "Shaka — Thumb + Pinky out" },
      "I LOVE YOU": { spoken: "I love you",  ext: [1,1,0,0,1], pose: "ILY — Thumb + Index + Pinky" }
    };

    const HOLD_MS = 800;
    let autoSpeak = true;
    let words = [];
    let cand = null, since = 0, committed = null;
    let facingMode = 'user';
    let cameraInst = null;
    let cameraOn   = false;

    /* ── DOM refs ── */
    const videoEl    = document.getElementById('webcam');
    const canvasEl   = document.getElementById('output_canvas');
    const ctx        = canvasEl.getContext('2d');
    const hudGesture = document.getElementById('hudGesture');
    const timerFill  = document.getElementById('timerFill');
    const sentDisp   = document.getElementById('sentenceDisplay');
    const statusDot  = document.getElementById('statusDot');

    /* ── Populate gesture list ── */
    const listCont = document.getElementById('gestureListContainer');
    for (const [name, info] of Object.entries(GESTURES)) {
      const el = document.createElement('div');
      el.className = 'mini-item';
      el.id = 'gitem_' + name.replace(/\s+/g,'_');
      el.innerHTML = `<div><div style="font-weight:600">${name}</div><div class="mini-item-desc">${info.pose}</div></div>`;
      listCont.appendChild(el);
    }

    /* ── Sensor update — overlay only ── */
    function updateSensors(bends) {
      for (let i = 0; i < 5; i++) {
        const pct = Math.round(bends[i] * 100) + '%';
        const ovVal = document.getElementById(`ov_val_${i}`);
        const ovBar = document.getElementById(`ov_bar_${i}`);
        if (ovVal) ovVal.textContent = pct;
        if (ovBar) ovBar.style.width  = pct;
      }
    }

    /* ── Toggle sensors overlay ── */
    function toggleSensors() {
      const el  = document.getElementById('sensorOverlay');
      const btn = document.getElementById('sensorsBtn');
      el.classList.toggle('hidden');
      btn.classList.toggle('active', !el.classList.contains('hidden'));
    }

    /* ── Drawers ── */
    function toggleDrawer(id) {
      closeAllDrawers();
      const el = document.getElementById(id + 'Drawer');
      if (el) {
        el.classList.add('open');
        document.getElementById('backdrop').classList.add('active');
      }
    }
    function closeAllDrawers() {
      document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open'));
      document.getElementById('backdrop').classList.remove('active');
      closeDrawingsModal();
    }

    /* ── Drawings modal ── */
    function openDrawingsModal() {
      document.getElementById('drawingsModal').classList.add('active');
    }
    function closeDrawingsModal() {
      document.getElementById('drawingsModal').classList.remove('active');
    }

    /* ── Voice ── */
    function toggleAutoSpeak() {
      autoSpeak = !autoSpeak;
      const btn  = document.getElementById('voiceBtn');
      const icon = document.getElementById('voiceIcon');
      btn.classList.toggle('active', autoSpeak);
      icon.innerHTML = autoSpeak
        ? '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>'
        : '<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
    }

    /* Unlock audio on first touch (iOS requirement) */
    function unlockAudio() {
      if (window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
    }
    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('click',      unlockAudio, { once: true });

    function speakText(text) {
      if (!window.speechSynthesis || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.0;
      window.speechSynthesis.speak(u);
    }

    function speakCurrentSentence() {
      const s = words.map(g => GESTURES[g] ? GESTURES[g].spoken : g).join(' ');
      if (s) speakText(s);
    }

    /* ── Sentence ── */
    function renderSentence() {
      if (words.length === 0) {
        sentDisp.innerHTML = '<span class="sentence-placeholder">Hold gesture steady for 0.8s…</span>';
      } else {
        sentDisp.textContent = words.map(g => GESTURES[g] ? GESTURES[g].spoken : g).join(' ');
      }
    }
    function clearSentence()  { words = []; renderSentence(); }
    function undoLastWord()   { if (words.length) { words.pop(); renderSentence(); } }

    /* ── Hand analysis ── */
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    function analyzeHand(lm) {
      const palm  = dist(lm[5], lm[17]) + 1e-6;
      const ext   = [0,0,0,0,0];
      const bend  = [0,0,0,0,0];

      // Thumb
      const t = dist(lm[4], lm[17]) / palm;
      ext[0]  = t > 1.3 ? 1 : 0;
      bend[0] = Math.max(0, Math.min(1, (1.8 - t) / 1.1));

      // Fingers 1-4
      const pairs = [[5,8],[9,12],[13,16],[17,20]];
      for (let i = 0; i < 4; i++) {
        const r = dist(lm[pairs[i][1]], lm[0]) / (dist(lm[pairs[i][0]], lm[0]) + 1e-6);
        ext[i+1]  = r > 1.48 ? 1 : 0;
        bend[i+1] = Math.max(0, Math.min(1, (1.9 - r) / 0.9));
      }

      const thumbUp = (lm[2].y - lm[4].y) > 0.6 * palm;
      return { ext, bend, thumbUp };
    }

    function classifyRules(a) {
      for (const [name, info] of Object.entries(GESTURES)) {
        if (a.ext.every((v, i) => v === info.ext[i])) {
          if (name === 'GOOD' && !a.thumbUp) return null;
          return name;
        }
      }
      return null;
    }

    /* ── MediaPipe results callback ── */
    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);

      let detected = null;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: 'rgba(52,211,153,0.75)', lineWidth: 2.5 });
        drawLandmarks  (ctx, lm, { color: '#ffffff', lineWidth: 1, radius: 3 });
        const a = analyzeHand(lm);
        updateSensors(a.bend);
        detected = classifyRules(a);
      } else {
        updateSensors([0,0,0,0,0]);
      }

      /* Highlight active gesture in drawer */
      document.querySelectorAll('.mini-item').forEach(el => el.classList.remove('active'));
      if (detected) {
        const item = document.getElementById('gitem_' + detected.replace(/\s+/g,'_'));
        if (item) item.classList.add('active');
      }

      /* HUD pill */
      if (detected) {
        hudGesture.textContent  = detected;
        hudGesture.className    = 'hud-gesture detected';
      } else {
        hudGesture.textContent  = 'Ready';
        hudGesture.className    = 'hud-gesture';
      }

      /* Hold timer */
      const now = performance.now();
      if (detected !== cand) { cand = detected; since = now; if (!detected) committed = null; }

      let progress = 0;
      if (detected !== null) {
        if (detected === committed) {
          progress = 1.0;
        } else {
          progress = Math.min((now - since) / HOLD_MS, 1.0);
          if (now - since >= HOLD_MS) {
            committed = detected;
            words.push(detected);
            renderSentence();
            if (autoSpeak && GESTURES[detected]) speakText(GESTURES[detected].spoken);
          }
        }
      }
      timerFill.style.width = (progress * 100) + '%';

      ctx.restore();
    }

    /* ── MediaPipe Hands setup ── */
    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    /* ── Camera ── */
    function startCamera(mode) {
      statusDot.className = 'status-dot';
      if (cameraInst) { try { cameraInst.stop(); } catch(e) {} }
      canvasEl.classList.toggle('mirrored', mode === 'user');

      cameraInst = new Camera(videoEl, {
        onFrame: async () => {
          if (videoEl.videoWidth > 0 && canvasEl.width !== videoEl.videoWidth) {
            canvasEl.width  = videoEl.videoWidth;
            canvasEl.height = videoEl.videoHeight;
          }
          await hands.send({ image: videoEl });
        },
        facingMode: mode,
        width:  { ideal: 1280 },
        height: { ideal: 720 }
      });
      cameraInst.start()
        .then(() => { statusDot.className = 'status-dot active'; cameraOn = true; })
        .catch(err => {
          statusDot.className = 'status-dot';
          alert('Camera Error: ' + err.message + '\nPlease allow camera access.');
        });
    }

    /* ── Camera on/off ── */
    function stopCamera() {
      if (cameraInst) { try { cameraInst.stop(); } catch(e) {} cameraInst = null; }
      // Also stop all media tracks so the browser releases the camera LED
      if (videoEl.srcObject) {
        videoEl.srcObject.getTracks().forEach(t => t.stop());
        videoEl.srcObject = null;
      }
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      updateSensors([0,0,0,0,0]);
      statusDot.className = 'status-dot';
      hudGesture.textContent = 'Camera Off';
      hudGesture.className   = 'hud-gesture';
      cameraOn = false;
    }

    function toggleCamera() {
      const btn  = document.getElementById('cameraBtn');
      const icon = document.getElementById('cameraIcon');
      if (cameraOn) {
        stopCamera();
        btn.classList.remove('active');
        // Show crossed-out camera icon
        icon.innerHTML = '<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        startCamera(facingMode);
        btn.classList.add('active');
        icon.innerHTML = '<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>';
      }
    }

    function flipCamera() {
      if (!cameraOn) return;
      facingMode = facingMode === 'user' ? 'environment' : 'user';
      startCamera(facingMode);
    }

    startCamera(facingMode);

    /* ── Keyboard shortcuts ── */
    window.addEventListener('keydown', e => {
      if      (e.key === 's' || e.key === 'S') speakCurrentSentence();
      else if (e.key === 'c' || e.key === 'C') clearSentence();
      else if (e.key === 'Backspace')           undoLastWord();
      else if (e.key === 'a' || e.key === 'A') toggleAutoSpeak();
      else if (e.key === 'f' || e.key === 'F') flipCamera();
      else if (e.key === 'g' || e.key === 'G') toggleDrawer('guide');
      else if (e.key === 'v' || e.key === 'V') toggleCamera();
    });
  </script>
</body>
</html>
